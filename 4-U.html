<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feliz cumpleaños Pañoña 💗</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;cursor:pointer}

*{box-sizing:border-box}
body{color:#ffe0ec;font-family:"Courier New",monospace}
.greeting{position:fixed;z-index:2;top:clamp(22px,5vh,52px);left:16px;right:16px;text-align:center;pointer-events:none;animation:appear 2s ease both}
.greeting p{margin:0 0 10px;font-size:10px;letter-spacing:.3em;color:#bd8199;text-transform:uppercase}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(26px,3.5vw,48px);color:#ffd0e4;text-shadow:0 0 26px #e95b9855}
.heart{display:inline-block;color:#ff80b4;font-family:Arial,sans-serif;animation:heartbeat 2.8s ease-in-out infinite}
.gallery{position:fixed;z-index:3;right:clamp(22px,4vw,70px);top:50%;transform:translateY(-45%);display:grid;gap:16px;width:clamp(135px,15vw,205px)}
.photo{padding:6px;background:linear-gradient(135deg,#28131dbb,#100b10e8);border:1px solid #f8a1c33d;border-radius:8px;box-shadow:0 8px 32px #0008;cursor:zoom-in;transition:transform .3s,border-color .3s;animation:appear 2s ease both}
.photo:nth-child(1){transform:rotate(-4deg);animation-delay:.4s}
.photo:nth-child(2){transform:rotate(3deg);animation-delay:.7s}
.photo:nth-child(3){transform:rotate(-2deg);animation-delay:1s}
.photo:hover,.photo:focus-visible{transform:rotate(0) scale(1.05);border-color:#ff9dc8;outline:2px solid #ff9dc8;outline-offset:4px}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.1em;color:#b0879b;pointer-events:none}
dialog{padding:12px;border:1px solid #b55c81;border-radius:12px;background:#120c12;max-width:92vw;max-height:92dvh;box-shadow:0 0 70px #e3629a22}
dialog::backdrop{background:#000d;backdrop-filter:blur(8px)}
dialog img{display:block;max-width:85vw;max-height:79dvh;object-fit:contain;border-radius:6px}
.close{display:block;margin:12px 0 0 auto;color:#ffd0e4;background:#321b29;border:1px solid #a65c7c;border-radius:20px;padding:8px 18px;cursor:pointer;font:inherit}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media(max-width:760px){
 canvas{height:calc(100dvh - 155px);height:calc(100svh - 155px)}
 .greeting{top:24px}.greeting p{font-size:9px;letter-spacing:.18em}
 .gallery{top:auto;bottom:35px;left:20px;right:20px;width:auto;transform:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:480px;margin:auto}
 .photo{padding:4px}.photo img{aspect-ratio:1.12;object-fit:cover}
 .hint{font-size:9px;bottom:10px}
}
@media(prefers-reduced-motion:reduce){.heart,.greeting,.photo{animation:none}.photo{transition:none}}

</style>
</head>

g.addColorStop(0,'rgba(255,100,150,'+(0.22*a)+')');
g.addColorStop(0.5,'rgba(220,60,120,'+(0.08*a)+')');
g.addColorStop(1,'rgba(150,30,80,0)');
ctx.fillStyle=g;ctx.fillRect(-R,-R,R*2,R*2);
ctx.restore();
}
const CHS=[],colorCache=new Map();
function render(T){
ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
drawHalo(T);
ctx.font=fs+'px "Courier New",monospace';ctx.textBaseline='top';ctx.textAlign='left';
let last=-1,count=0;
for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
const i=r*cols+c,code=chr[i];if(!code)continue;
if(zb[i]>-100)count++;
const key=((cR[i]>>2)<<12)|((cG[i]>>2)<<6)|(cB[i]>>2);
if(key!==last){
let s=colorCache.get(key);
if(!s){s='rgb('+((key>>12)<<2)+','+(((key>>6)&63)<<2)+','+((key&63)<<2)+')';colorCache.set(key,s);}
ctx.fillStyle=s;last=key;
}
ctx.fillText(CHS[code]||(CHS[code]=String.fromCharCode(code)),c*cw,r*ch);
}
gctx.imageSmoothingEnabled=true;
gctx.clearRect(0,0,gcv.width,gcv.height);
gctx.drawImage(cv,0,0,gcv.width,gcv.height);
ctx.save();ctx.setTransform(1,0,0,1,0,0);
ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.55;ctx.imageSmoothingEnabled=true;
ctx.drawImage(gcv,0,0,cv.width,cv.height);
ctx.restore();ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
drawHUD(T,count);
}
function drawHUD(T,count){
const sm=Math.max(12,Math.round(fs*1.1));
const fa=0.25+0.75*smooth(clamp((T-T_BLOOM0-5)/4,0,1));
ctx.save();
ctx.font=sm+'px "Courier New",monospace';ctx.textBaseline='top';
if(W>520){
ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=5;
const y=H-sm*6.2,x=sm*1.5;
ctx.fillStyle='rgba(255,175,210,'+fa+')';
ctx.fillText(CONFIG.signature,x,y);
ctx.fillStyle='rgba(238,238,248,'+fa+')';
ctx.fillText('stage   '+state.stage,x,y+sm*1.3);
ctx.fillText('bloom   '+state.pct.toFixed(1)+'%   sway '+(swX*100).toFixed(2)+'°',x,y+sm*2.6);
ctx.fillText('letters '+count.toLocaleString(),x,y+sm*3.9);
}
ctx.restore();
ctx.globalAlpha=1;ctx.textAlign='left';
}
let t0=performance.now(),lastT=t0;
function frame(now){
requestAnimationFrame(frame);
const T=Math.max(0,(now-t0)/1000),dt=clamp((now-lastT)/1000,0,0.05);lastT=now;TT=T;
zb.fill(-1e9);chr.fill(0);
YAW=0.1+0.32*Math.sin(T*0.23);PITCH=0.60+0.04*Math.sin(T*0.17);
cY=Math.cos(YAW);sY=Math.sin(YAW);cP=Math.cos(PITCH);sP=Math.sin(PITCH);
swX=0.05*(Math.sin(0.9*T)*0.7+Math.sin(0.37*T+1)*0.5);
swZ=0.02*Math.sin(0.6*T+2);
drawBackground(T);
scene(T);
REF=1;scene(T);REF=0;
update(T,dt);
drawFX();
render(T);
}
cv.addEventListener('pointerdown',()=>{t0=performance.now();parts=[];drops=[];ripples=[];anchors.forEach(a=>{a.ok=false;a.used=false});spawnT=2;});

const memory=document.getElementById('memory');
let lastPhoto;
document.querySelectorAll('.photo').forEach(button=>button.addEventListener('click',()=>{
 lastPhoto=button;
 memory.querySelector('img').src=button.querySelector('img').src;
 memory.showModal();
}));
memory.querySelector('.close').addEventListener('click',()=>memory.close());
memory.addEventListener('click',event=>{if(event.target===memory){const r=memory.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)memory.close();}});
memory.addEventListener('close',()=>lastPhoto?.focus());

resize();initBackground();
requestAnimationFrame(frame);
</script>
</body>
